<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý AI: Chuyển Giáo Án Thành Slide PowerPoint</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PptxGenJS CDN để xuất file .pptx -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        .slide-aspect {
            aspect-ratio: 16 / 9;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 rounded-lg text-white">
                <i class="fa-solid fa-file-powerpoint text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white leading-tight">AI Lesson Plan to Slide Studio</h1>
                <p class="text-xs text-slate-400">Chuyển đổi Kế hoạch bài dạy (CV 7991) thành PowerPoint (.pptx)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="loadSampleLesson()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 rounded flex items-center gap-2 border border-slate-600 transition">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Dán Giáo Án Mẫu
            </button>
            <button onclick="exportToPPTX()" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-500 font-semibold text-white rounded-lg shadow-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-download"></i> Tải File PowerPoint (.pptx)
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 grid grid-cols-12 gap-0 overflow-hidden">

        <!-- CỘT TRÁI: NHẬP GIÁO ÁN (4 CỘT) -->
        <section class="col-span-12 lg:col-span-4 bg-slate-800/50 border-r border-slate-700 p-5 flex flex-col h-[calc(100vh-65px)]">
            <div class="flex justify-between items-center mb-3">
                <label class="text-sm font-semibold text-indigo-300 flex items-center gap-2">
                    <i class="fa-solid fa-align-left"></i> Nhập Kế Hoạch Bài Dạy (Giáo Án)
                </label>
                <span class="text-xs text-slate-400">Chuẩn CV 7991 / GDPT</span>
            </div>
            
            <textarea id="lessonInput" class="flex-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none custom-scrollbar leading-relaxed" placeholder="Dán toàn bộ Kế hoạch bài dạy của thầy/cô vào đây (Gồm Mục tiêu, Hoạt động Khởi động, Khám phá, Luyện tập, Vận dụng)..."></textarea>

            <!-- TÙY CHỌN GIAO DIỆN SLIDE -->
            <div class="mt-4 pt-3 border-t border-slate-700">
                <label class="text-xs font-medium text-slate-300 mb-2 block">Mẫu giao diện (Color Theme):</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setTheme('classic')" id="btnThemeClassic" class="p-2 text-xs border border-indigo-500 bg-indigo-950/50 text-indigo-200 rounded flex flex-col items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-indigo-600"></span> Xanh Dương
                    </button>
                    <button onclick="setTheme('emerald')" id="btnThemeEmerald" class="p-2 text-xs border border-slate-700 bg-slate-900 text-slate-400 rounded flex flex-col items-center gap-1 hover:border-slate-500">
                        <span class="w-3 h-3 rounded-full bg-emerald-600"></span> Tự Nhiên
                    </button>
                    <button onclick="setTheme('purple')" id="btnThemePurple" class="p-2 text-xs border border-slate-700 bg-slate-900 text-slate-400 rounded flex flex-col items-center gap-1 hover:border-slate-500">
                        <span class="w-3 h-3 rounded-full bg-purple-600"></span> Năng Động
                    </button>
                </div>
            </div>

            <button onclick="processLessonPlan()" class="mt-4 w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-md flex justify-center items-center gap-2 transition">
                <i class="fa-solid fa-gears"></i> Phân Tích & Tạo Slide Bài Giảng
            </button>
        </section>

        <!-- CỘT PHẢI: XEM TRƯỚC VÀ CHỈNH SỬA SLIDE (8 CỘT) -->
        <section class="col-span-12 lg:col-span-8 bg-slate-900 p-6 flex flex-col h-[calc(100vh-65px)] overflow-y-auto custom-scrollbar">
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-400"></i> Danh Sách Slide Bài Giảng
                    </h2>
                    <span id="slideCountBadge" class="bg-indigo-900/80 text-indigo-300 text-xs px-2 py-0.5 rounded-full border border-indigo-700">0 Slide</span>
                </div>
                <button onclick="addNewSlide()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-md flex items-center gap-1">
                    <i class="fa-solid fa-plus text-indigo-400"></i> Thêm Slide Mới
                </button>
            </div>

            <!-- CONTAINER CHỨA DANH SÁCH SLIDE -->
            <div id="slidesContainer" class="space-y-6 flex-1">
                <!-- Thông báo trống ban đầu -->
                <div id="emptyState" class="h-64 border-2 border-dashed border-slate-800 rounded-xl flex flex-col justify-center items-center text-slate-500">
                    <i class="fa-solid fa-desktop text-4xl mb-3 text-slate-600"></i>
                    <p class="text-sm">Chưa có nội dung Slide nào.</p>
                    <p class="text-xs text-slate-600 mt-1">Dán giáo án ở cột bên trái và bấm "Phân Tích & Tạo Slide Bài Giảng".</p>
                </div>
            </div>

        </section>

    </main>

    <!-- SCRIPT XỬ LÝ CHÍNH -->
    <script>
        let slidesData = [];
        let currentTheme = 'classic';

        // Mẫu Giáo án CV 7991 để chạy thử
        function loadSampleLesson() {
            document.getElementById('lessonInput').value = `KẾ HOẠCH BÀI DẠY (NỘI DUNG MẪU TẠO SLIDE)

I. MỤC TIÊU BÀI HỌC
- Học sinh nắm vững các khái niệm cơ bản và cấu trúc chính của bài học.
- Rèn luyện kỹ năng tư duy phản biện, làm việc nhóm và giải quyết vấn đề.
- Phát triển phẩm chất tự học, trách nhiệm và chủ động trong học tập.

II. HOẠT ĐỘNG 1: KHỞI ĐỘNG (WARM-UP)
- Mục tiêu: Tạo tâm thế hứng thú, kết nối kiến thức thực tế với bài học mới.
- Nội dung: Học sinh quan sát hình ảnh/video tình huống thực tế và thảo luận câu hỏi gợi mở.
- Sản phẩm: Nhận thức được vấn đề cần giải quyết và đưa ra các dự đoán ban đầu.

III. HOẠT ĐỘNG 2: HÌNH THÀNH KIẾN THỨC MỚI
- Mục tiêu: Học sinh tự khám phá, tiếp thu kiến thức trọng tâm của bài học.
- Nội dung:
  1. Thảo luận nhóm tìm hiểu các khái niệm và định lý cơ bản.
  2. Phân tích các ví dụ minh họa và sơ đồ tư duy hệ thống hóa kiến thức.
- Sản phẩm: Phiếu học tập cá nhân/nhóm hoàn thành đúng yêu cầu.

IV. HOẠT ĐỘNG 3: LUYỆN TẬP
- Mục tiêu: Củng cố và áp dụng trực tiếp kiến thức vừa học vào bài tập.
- Nội dung: Học sinh thực hiện các bài tập trắc nghiệm nhanh và bài tập tự luận theo cấp độ.
- Sản phẩm: Đáp án các câu hỏi luyện tập và lời giải chi tiết trên bảng/phiếu học tập.

V. HOẠT ĐỘNG 4: VẬN DỤNG & DẶN DÒ
- Mục tiêu: Mở rộng kiến thức, ứng dụng vào giải quyết tình huống thực tế trong đời sống.
- Nội dung: Giải quyết bài toán thực tế nâng cao và nhận nhiệm vụ học tập tại nhà.
- Sản phẩm: Bài làm vận dụng mở rộng và ghi chú nhiệm vụ về nhà.`;
        }

        function setTheme(theme) {
            currentTheme = theme;
            ['Classic', 'Emerald', 'Purple'].forEach(t => {
                const btn = document.getElementById(`btnTheme${t}`);
                if (t.toLowerCase() === theme) {
                    btn.className = "p-2 text-xs border border-indigo-500 bg-indigo-950/50 text-indigo-200 rounded flex flex-col items-center gap-1";
                } else {
                    btn.className = "p-2 text-xs border border-slate-700 bg-slate-900 text-slate-400 rounded flex flex-col items-center gap-1 hover:border-slate-500";
                }
            });
            renderSlides();
        }

        // Tự động phân tích giáo án văn bản thành cấu trúc Slide
        function processLessonPlan() {
            const rawText = document.getElementById('lessonInput').value.trim();
            if (!rawText) {
                alert('Vui lòng dán nội dung Kế hoạch bài dạy trước khi bấm tạo slide!');
                return;
            }

            slidesData = [];
            
            // 1. Slide Tiêu đề
            const lines = rawText.split('\n').filter(l => l.trim() !== '');
            let title = "BÀI GIẢNG BÀI HỌC";
            if (lines.length > 0) title = lines[0].replace(/^[I|V|X|\d|.\s]+/, '').trim();

            slidesData.push({
                badge: "BÀI GIẢNG ĐIỆN TỬ",
                title: title,
                bullets: [
                    "Chương trình giảng dạy chuẩn Bộ GD&ĐT (CV 7991)",
                    "Môn học: Khoa học / Ngữ văn / Toán / Lịch sử",
                    "Giáo viên thực hiện: [Điền tên giáo viên]"
                ],
                visual: "Hình ảnh bìa minh họa chủ đề bài học phong cách hiện đại.",
                notes: "Giáo viên chào lớp, ổn định tổ chức và giới thiệu tên bài học."
            });

            // Phân đoạn theo từ khóa hoạt động sư phạm
            const sections = rawText.split(/(?=(?:I{1,3}|IV|V|VI|\d+)\.\s+|HOẠT ĐỘNG|MỤC TIÊU)/i);

            sections.forEach(sec => {
                const secText = sec.trim();
                if (!secText) return;

                if (secText.includes("MỤC TIÊU")) {
                    const bullets = extractBullets(secText);
                    slidesData.push({
                        badge: "MỤC TIÊU BÀI HỌC",
                        title: "Yêu Cầu Cần Đạt",
                        bullets: bullets.length ? bullets : ["Nắm vững kiến thức trọng tâm bài học", "Rèn luyện kỹ năng vận dụng thực hành", "Phát triển năng lực tự học và tư duy"],
                        visual: "Biểu tượng mục tiêu, mục đích học tập.",
                        notes: "Giáo viên quán xán các mục tiêu trọng tâm cần đạt cho học sinh."
                    });
                } else if (secText.includes("KHỞI ĐỘNG") || secText.includes("WARM-UP")) {
                    const bullets = extractBullets(secText);
                    slidesData.push({
                        badge: "HOẠT ĐỘNG 1",
                        title: "Khởi Động & Kết Nối",
                        bullets: bullets.length ? bullets : ["Quan sát tình huống / video thực tế", "Thảo luận câu hỏi gợi mở đầu giờ", "Kết nối kiến thức vào bài học mới"],
                        visual: "Hình ảnh tình huống khởi động gợi mở suy nghĩ.",
                        notes: "Tạo không khí hứng thú, dẫn dắt học sinh vào chủ đề."
                    });
                } else if (secText.includes("HÌNH THÀNH KIẾN THỨC") || secText.includes("KHÁM PHÁ")) {
                    const bullets = extractBullets(secText);
                    slidesData.push({
                        badge: "HOẠT ĐỘNG 2",
                        title: "Hình Thành Kiến Thức Mới",
                        bullets: bullets.length ? bullets : ["Thảo luận nhóm tìm hiểu nội dung chính", "Phân tích ví dụ & mô hình minh họa", "Rút ra kết luận và ghi nhớ kiến thức"],
                        visual: "Sơ đồ tư duy / Bảng so sánh tổng hợp kiến thức.",
                        notes: "Hướng dẫn học sinh tự khám phá và tiếp thu kiến thức trọng tâm."
                    });
                } else if (secText.includes("LUYỆN TẬP")) {
                    const bullets = extractBullets(secText);
                    slidesData.push({
                        badge: "HOẠT ĐỘNG 3",
                        title: "Luyện Tập & Củng Cố",
                        bullets: bullets.length ? bullets : ["Giải bài tập trắc nghiệm củng cố nhanh", "Thực hành bài tập tự luận theo cấp độ", "Nhận xét, chữa bài và rút kinh nghiệm"],
                        visual: "Hình ảnh câu hỏi luyện tập và đáp án trực quan.",
                        notes: "Tổ chức cho học sinh làm bài tập và chữa bài."
                    });
                } else if (secText.includes("VẬN DỤNG")) {
                    const bullets = extractBullets(secText);
                    slidesData.push({
                        badge: "HOẠT ĐỘNG 4",
                        title: "Vận Dụng & Dặn Dò",
                        bullets: bullets.length ? bullets : ["Áp dụng kiến thức giải quyết bài toán thực tế", "Hướng dẫn nhiệm vụ học tập tự học ở nhà", "Chuẩn bị nội dung cho tiết học tiếp theo"],
                        visual: "Hình ảnh ứng dụng thực tế đời sống.",
                        notes: "Giao nhiệm vụ mở rộng và dặn dò về nhà."
                    });
                }
            });

            renderSlides();
        }

        function extractBullets(text) {
            return text.split('\n')
                .map(line => line.trim())
                .filter(line => line.startsWith('-') || line.startsWith('+') || line.startsWith('*') || /^\d+\./.test(line))
                .map(line => line.replace(/^[-+*\d.]\s*/, '').trim())
                .slice(0, 4);
        }

        function renderSlides() {
            const container = document.getElementById('slidesContainer');
            document.getElementById('slideCountBadge').innerText = `${slidesData.length} Slide`;

            if (slidesData.length === 0) {
                container.innerHTML = `
                    <div id="emptyState" class="h-64 border-2 border-dashed border-slate-800 rounded-xl flex flex-col justify-center items-center text-slate-500">
                        <i class="fa-solid fa-desktop text-4xl mb-3 text-slate-600"></i>
                        <p class="text-sm">Chưa có nội dung Slide nào.</p>
                        <p class="text-xs text-slate-600 mt-1">Dán giáo án ở cột bên trái và bấm "Phân Tích & Tạo Slide Bài Giảng".</p>
                    </div>`;
                return;
            }

            let themeClasses = {
                headerBg: "bg-indigo-600",
                badgeBg: "bg-indigo-900/80 text-indigo-200 border-indigo-700",
                borderAccent: "border-indigo-500"
            };

            if (currentTheme === 'emerald') {
                themeClasses = {
                    headerBg: "bg-emerald-600",
                    badgeBg: "bg-emerald-900/80 text-emerald-200 border-emerald-700",
                    borderAccent: "border-emerald-500"
                };
            } else if (currentTheme === 'purple') {
                themeClasses = {
                    headerBg: "bg-purple-600",
                    badgeBg: "bg-purple-900/80 text-purple-200 border-purple-700",
                    borderAccent: "border-purple-500"
                };
            }

            let html = '';
            slidesData.forEach((slide, idx) => {
                html += `
                <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl mb-6">
                    <!-- Thanh tiêu đề điều khiển -->
                    <div class="bg-slate-800/90 border-b border-slate-700 px-4 py-2 flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-400">SLIDE ${idx + 1}</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="removeSlide(${idx})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 rounded">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </div>
                    </div>

                    <!-- MÔ PHỎNG XEM TRƯỚC SLIDE 16:9 -->
                    <div class="p-4 bg-slate-950">
                        <div class="slide-aspect bg-slate-900 border ${themeClasses.borderAccent} rounded-lg p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                            
                            <!-- Top Header Slide -->
                            <div>
                                <div class="inline-block px-2.5 py-0.5 rounded text-[10px] font-bold tracking-wider border ${themeClasses.badgeBg} mb-2">
                                    <input type="text" value="${slide.badge}" onchange="updateSlideData(${idx}, 'badge', this.value)" class="bg-transparent outline-none w-full">
                                </div>
                                <input type="text" value="${slide.title}" onchange="updateSlideData(${idx}, 'title', this.value)" class="w-full bg-transparent text-xl font-bold text-white outline-none border-b border-transparent focus:border-slate-600 pb-1">
                            </div>

                            <!-- Bullet Points -->
                            <div class="my-2 space-y-2">
                                ${slide.bullets.map((b, bIdx) => `
                                    <div class="flex items-start gap-2">
                                        <span class="text-indigo-400 mt-1 text-xs">•</span>
                                        <input type="text" value="${b}" onchange="updateBulletData(${idx},${bIdx}, this.value)" class="w-full bg-transparent text-xs text-slate-200 outline-none border-b border-transparent focus:border-slate-700">
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Footer Gợi ý Visual -->
                            <div class="bg-slate-800/60 p-2 rounded border border-slate-700/50 flex items-center gap-2 text-[11px] text-amber-300">
                                <i class="fa-regular fa-image"></i>
                                <input type="text" value="${slide.visual}" onchange="updateSlideData(${idx}, 'visual', this.value)" class="w-full bg-transparent outline-none italic text-amber-200">
                            </div>

                        </div>
                    </div>

                    <!-- LỜI THOẠI GIÁO VIÊN (SPEAKER NOTES) -->
                    <div class="p-3 bg-slate-800 border-t border-slate-700/60 flex items-center gap-2">
                        <i class="fa-solid fa-comment-dots text-slate-400 text-xs"></i>
                        <input type="text" value="${slide.notes}" onchange="updateSlideData(${idx}, 'notes', this.value)" placeholder="Lời thoại / Ghi chú giảng dạy cho giáo viên..." class="w-full bg-transparent text-xs text-slate-300 outline-none">
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function updateSlideData(idx, field, value) {
            slidesData[idx][field] = value;
        }

        function updateBulletData(slideIdx, bulletIdx, value) {
            slidesData[slideIdx].bullets[bulletIdx] = value;
        }

        function removeSlide(idx) {
            slidesData.splice(idx, 1);
            renderSlides();
        }

        function addNewSlide() {
            slidesData.push({
                badge: "HOẠT ĐỘNG BỔ SUNG",
                title: "Tiêu Đề Slide Mới",
                bullets: ["Nội dung ý chính thứ nhất", "Nội dung ý chính thứ hai", "Nội dung ý chính thứ ba"],
                visual: "Gợi ý hình ảnh minh họa cho slide.",
                notes: "Lời thoại giảng dạy của giáo viên."
            });
            renderSlides();
        }

        // Xuất trực tiếp ra file .pptx bằng PptxGenJS
        function exportToPPTX() {
            if (slidesData.length === 0) {
                alert('Chưa có slide nào để xuất! Vui lòng bấm tạo slide trước.');
                return;
            }

            const pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            slidesData.forEach((slide) => {
                const pptSlide = pptx.addSlide();

                // Màu sắc giao diện
                let primaryColor = "1e1b4b"; // Indigo đậm
                let accentColor = "4f46e5";

                if (currentTheme === 'emerald') {
                    primaryColor = "064e3b";
                    accentColor = "059669";
                } else if (currentTheme === 'purple') {
                    primaryColor = "3b0764";
                    accentColor = "9333ea";
                }

                // Nền Slide
                pptSlide.background = { color: "F8FAFC" };

                // Đánh dấu Thẻ Badge
                pptSlide.addText(slide.badge.toUpperCase(), {
                    x: 0.8, y: 0.5, w: 4.0, h: 0.3,
                    fontSize: 10, bold: true, color: accentColor
                });

                // Tiêu đề Slide
                pptSlide.addText(slide.title, {
                    x: 0.8, y: 0.8, w: 8.5, h: 0.8,
                    fontSize: 22, bold: true, color: primaryColor
                });

                // Các ý chính Bullets
                const bulletItems = slide.bullets.map(b => ({ text: b, options: { bullet: true, inset: 0.2 } }));
                pptSlide.addText(bulletItems, {
                    x: 0.8, y: 1.8, w: 8.5, h: 3.2,
                    fontSize: 14, color: "334155", lineSpacing: 24
                });

                // Khung gợi ý Visual
                pptSlide.addText(`[Gợi ý hình ảnh]: ${slide.visual}`, {
                    x: 0.8, y: 5.2, w: 8.5, h: 0.4,
                    fontSize: 10, italic: true, color: "D97706",
                    fill: { color: "FEF3C7" }
                });

                // Speaker Notes
                if (slide.notes) {
                    pptSlide.addNotes(slide.notes);
                }
            });

            // Tải file về máy
            pptx.writeFile({ fileName: "Bài_Giảng_Slide_Dien_Tu.pptx" });
        }
    </script>
</body>
</html>
